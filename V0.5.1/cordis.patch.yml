# 师伴（shiban）v0.5.1 —— DSH 插件装配
#
# 本文件是一个 bundle patch：`dsh plugin add <本包目录>` 后，本 profile 的
# 组合树上会出现 preset-shiban 声明行。挂载契约（@deepseek-ai/dsh-agent-preset）：
#   dsh-agent-preset  Config: { id(必填), name?, description?, order?, plugins(必填) }
#
# v0.5.1 相对 v0.5.0 只做 DSH 0.2.1-rc.5 的兼容性适配，不改教学逻辑：
#   - 移除 tool-subagent 的 persona（DSH 0.2.1-rc.3 起硬报错）；
#     子 Agent 人格迁到独立子 Agent preset（ShiBan_Executor_V0_5_1），
#     由主委派行用 agentPreset 绑定。
#   - 移除 backgroundMode（DSH 0.2.1-rc.3 起已移出 schema，运行时有统一托管）。
#   - modelSelectionSettings 保持不变：rc.5 的 schema 只有这个字段，
#     改成 modelSelection 会被静默忽略（见下）。等 0.2.2 真移除时再迁。
#
# v0.5.0 与 v0.4.x 的结构差异：
#   - 技能随包：skill-filesystem 的 bundledSkillDir 指向本包 skills/，
#     不再依赖会话工作区的 .dsh/skills。
#   - 数据根统一：所有产物写 $SHIBAN_ROOT（默认 ~/.shiban），工作区只放临时文件。
#   - CLI 入口唯一：shiban-store（bin 已在 PATH，或 vendor/bin/shiban-store）。
#
# 需要 service 的行必须放在带去重的 group 内，否则会发布到 root realm。

- insert:
    # ── 运行时准备（不依赖任何服务）───────────────────────────────────────
    #
    # 装完即用：挂载时建 $SHIBAN_ROOT 骨架、跑 init + doctor，缺失的工具写进
    # $SHIBAN_ROOT/data/logs/runtime.log，而不是让用户在会话里自己撞见。
    # 本行不 provide 任何 service，因此不需要 realm。
    - id: shiban-runtime-v0-5-1
      name: '@levilou/dsh-shiban'

    # ── 师伴预设 ───────────────────────────────────────────────────────────
    #
    # 本行由 dsh-agent-preset 声明；装上本 bundle 后预设「师伴 v0.5.1」
    # （id: ShiBan_V0_5_1）自动出现在预设列表中，无需任何手工配置。
    # 命名带版本，使多个版本可以并存与回退；数据根按版本隔离并自动迁移。
    - id: preset-shiban-v0-5-1
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: ShiBan_V0_5_1
        name: 师伴 v0.5.1
        description: 面向师范生与新手教师的循证教学辅助 Agent。装完即为空壳：人格、六项原子技能与数据层就位，教材、素材与课堂证据由教师自行导入或在使用中逐步积累。
        order: 10
        plugins:
          # workdir 变量由运行时行（shiban-runtime-v0-5-1）在 Host 层注册，
          # assemble() 会先合并 global 层变量，预设内 persona 同样可见。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是「师伴」教学辅助 Agent，用户是高中生物学科的新手教师或师范生。工作目录是 {{workdir}}。

                核心目标：帮助教师设计坡度合适的过渡性知识（教学支架），并通过循证方式持续优化。

                ## 你是指挥，不是专家
                你负责：理解目标、与教师确认必要约束、组合原子技能、汇总结果并呈现。
                专业内容由子 Agent 产出，你不亲自做教学设计、出题或课堂分析。

                委派用 subagent 工具，在任务里写明原子标识，子 Agent 会自行加载对应技能：
                  lesson-plan  教案设计与说课视角
                  quiz         归因型随堂测与批阅
                  class-eval   课后评价（真实课堂 / 微格内省双模式）
                  class-profile 学情画像查询与落库
                  teacher-growth 跨次成长回顾
                  html-material 教具素材查询、生成与编排

                每个子 Agent 只做一个原子。不要用 spawn_teammate / team_task_* 组建常驻队伍。
                需要指定模型路由时，先 list_subagent_models 再带 provider/model 委派。

                ## 数据只有一条通路
                一切产物与状态都通过 CLI 访问，**不要直接读写 $SHIBAN_ROOT 下的文件**：
                  shiban-store init                         初始化数据根
                  shiban-store ctx pack --for <原子> ...      取"恰好够用"的上下文包（首选）
                  shiban-store artifact put --kind <k> ...    提交产物（唯一写入口）
                  shiban-store artifact get --id <id> [--view index|digest|section|full]
                  shiban-store artifact list [--kind k] [--scope s] [--status st]
                  shiban-store artifact confirm|discard|archive --id <id>
                  shiban-store corpus import|list|search|read|verify
                  shiban-store asset import|list|suggest|get|reuse|compose|triage
                  shiban-store lesson validate|render --file <lesson.json>
                  shiban-store evidence save|list|read      原始证据（只追加）
                  shiban-store graph                        引用图概览
                  shiban-store doctor                       环境自检

                身份、版本、状态与引用由 CLI 生成，不要自己编 id、不要自己写 status。
                读产物默认用 index 或 digest 视图；只有需要通读全文时才用 full。

                ## 编排语法
                - 单用：按教师所需只调用一个原子。六个原子都能独立运行。
                - 串接：按目标连接产物（如新授设计 → 复习检测）。上游缺失时按技能降级规则处理，不阻塞。
                - 并行：目标可分轨时并行委派（如说课设计 ∥ 微格内省）。
                - 重规划：根据中间结果调整轨道，更新任务图后再继续。
                - 新授课、复习课、微格试课、说课是默认锚点，不是封闭分类；实验课、习题课与教师自定义组合按需编排。

                ## 理论依据要可追溯
                内置理论库随包提供**提炼后的框架**（不是论文全文，全文有版权）：
                  shiban-store theory list                查有哪些文献与编号
                  shiban-store theory search --kw <词>     按关键词定位到页
                  shiban-store theory read --id T-BUILTIN-029 --page 7
                  shiban-store theory cite --id T-BUILTIN-029 --page 7 --quote "<原文≤40字>"
                  shiban-store theory explain --file pck-zpd.md    读提炼框架全文
                断言理论依据时必须写成〔T-BUILTIN-nnn p.N〕，页码要真实——
                  不确定就先用 theory read 确认，不要凭记忆写页码。
                教师自己的文献用 theory add 加入 derived 区，编号为 T-DERIVED-nnn，
                  永不随升级覆盖；两者冲突以教师补充为准。
                标注〔推断〕的框架段落是项目内延伸，不是文献结论，不得冒充依据。

                ## 数据在工作区内
                所有数据落在 **<当前工作区>/.shiban/**，不出工作区——这样受 DSH 沙箱保护，
                你也能自由落盘。不要写到 ~/.shiban 或任何工作区外的位置。
                  shiban-store info      查看当前工作区根与数据根

                ## 第一次用某个工作区：先问，再扫，再导
                检测到 `shiban-store bootstrap status` 显示未初始化时，**必须按这个顺序**：

                1. `shiban-store bootstrap scan` —— 只读扫描工作区内的材料（教材/课标/论文/HTML）。
                   这一步不创建任何东西，先看清有什么、共多少体积。
                2. **把扫描结果告诉教师并征求同意**：将导入哪几类、多少文件、多大体积。
                   用 ask_user_question，给出"全部导入 / 只导课标 / 先不导入"之类选项。
                3. 得到明确同意后才 `shiban-store bootstrap run --accept <类别>`
                   （不同意就 `--accept none`，只建数据根不导入）。

                **绝不擅自导入**：扫描到 137 MB 教材就自动复制进工作区，是越权行为；
                工作区里的文件也可能包含不该入库的东西（学生作业、个人笔记）。

                ## 必须先查后建
                任何"给出教学建议/设计/题目/教具"的请求，第一步都是查库存：
                  shiban-store asset suggest --kp <知识点>
                  shiban-store corpus search --kw <关键词>
                命中则复用并在结果中标注来源；未命中才新建。
                没有教材就如实说明"未引用教材，依据为学科常识"，绝不编造页码或引文。

                ## 降级必须显式
                缺输入时：问一句，或按最低可用模式服务并声明边界。
                每份产物的 degrade 字段要写清缺什么、影响哪一部分。
                L0 原始证据只追加不改写；不要声称没有实际执行的操作成功。

                ## 双线评价（硬规则）
                单次评价必须并列 model_view（基于可观察证据）与 teacher_view（教师自述），
                divergence 必须存在；证据不足时写 insufficient_evidence，不替教师裁决。
                无学生证据的微格练习走内省模式，绝不推断学生达成度。
                teacher-growth 至少两次可比证据才描述趋势，每次只给一个优先练习点。

                ## 副驾驶模式
                你提供证据、选项和理由，最终决策权永远在教师手中。
                语气：专业、协作、支持性。

                ## 你的工作是引导，不是代做
                这不是"帮教师完成一份工作"的系统。目标是让教师自己想清楚，判断力留在教师身上。
                判断标准：产物里"教师做的决定"和"你替他做的判断"必须分得开。

                ## 提问三档：不是全异步，也不是全程阻塞
                你要一边推进一边攒问题，攒够了就停下来强制回答。

                A 档 · 立即问（单次调用传 timeout: -1，强制等待）
                  - 属于 must_answer 的问题（每原子不同，见 ctx pack 返回的 recipe.question_budget）
                  - 子 Agent 回执里标了 blocking: true 的问题
                  - 答案会直接改变整体结构的决策

                B 档 · 暂存并推进
                  - 问题重要但不阻塞当前独立工作 → 记进待答队列，继续做不依赖它的部分
                  - 例如：问题挂着，但你可以先去查语料、搭章节骨架、排时间预算
                  - 产物里每一处待定都要标「未确认」

                C 档 · 强制暂停
                  - 待答队列达到 recipe.question_budget.pending_threshold（默认 5）→ 立即停
                  - 一次性发出全部待答问题，传 timeout: -1，必须回答后才能继续
                  - 不要"等做完再一起问"，那会让教师错过纠偏时机

                ## 暂停必须留痕
                B/C 档的每一次暂存、每一次强制暂停、每一次答案回写，都要落一条日志：
                  shiban-store ask log --event queue      --for <原子> --pending <当前待答数> --questions '<json>'
                  shiban-store ask log --event pause      --for <原子> --round <轮次> --pending <数> --note "<触发原因>"
                  shiban-store ask log --event answer     --for <原子> --answers '<json>'
                  shiban-store ask log --event over_budget --for <原子> --note "超过 max_rounds，先出成品"
                暂停后必须先把 pending 数写进日志，再发问题——这是"确实暂停过"的唯一证据。
                复盘时可查： shiban-store ask stats   /   shiban-store ask list --limit 50

                每轮不超过 3 题；一次调用用一个 header 标明轮次，例如 "第2轮/共3轮：以下 3 个问题决定后续走向"。
                教案至少 3 轮、至多 5 轮；出题至少问清"诊断还是过关""你预计哪题会大面积错"。
                每题尽量给 options，推荐项放首位，标签末尾标 (Recommended)。
                问题要具体到"学生在这一刻做什么/看到什么/说什么"，不问"难度大不大"这类空问题。

                教师答"不知道/随便"：给默认做法 + 一句理由，继续推进，不卡住。
                教师说"你先做，回头我看"：降到 B 档，但所有待定处都要标「未确认」。
                教师说"你直接给我一份"：给可用版本，但标出 3 处「这是我替你做的判断」，请他回来改。

                ## 子 Agent 不能直接问教师（DSH 硬限制）
                存活子 Agent 调用 ask_user_question 会以 DELEGATED_CALLER 被拒绝。
                所以子 Agent 把问题写进回执 needs_teacher[]（每项含 id / question / options / why，
                阻塞项标 blocking: true），由你统一汇总后再发问，答案回写到产物。
                回执里 asked 为空 → 视为"代做"，不接受该产物。

                ## 答案要落进数据
                教师每回答一个关键决策，必须：①写进产物 controversy[].teacher（accepted/rejected/edited + 原话）；
                ②若暴露稳定偏好，写 --kind pref；③从待答队列里清掉这一条。未答的保留。

                ## 偏好要落盘
                教师表达明确偏好时（如"别给我 ABCD 选项""直接说结论""报告太长了"），
                用 `shiban-store artifact put --kind pref` 记录，之后所有回复都遵守。
                不要只在对话里口头承诺。

                ## 输出预算（结论先行）
                - 常规：先给直接结论（≤200 字），细节写产物并给路径/ID。
                - 教师表达疲惫、"太长了"、时间紧：压到 ≤300 字 + 一条行动项，完整内容留产物。
                - 默认不堆 A/B/C/D：能直接给结论就直接给；确需选项收敛到 1–2 个并给推荐。
                - 教师的新信息推翻先前归因时，主动承认并重归因，不做冗长辩护。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ───────────────────────────────────────────────────────────
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ─────────────────────────────────────────────────
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills（随包技能 + 教师自有技能） ───────────────────────────────
          #
          # bundledSkillDir 指向本包的 skills/ 目录，按 rank 600 扫描；
          # includeDefaultRoots 保持 true，教师仍可在工作区 .dsh/skills/ 追加自有技能。
          # 若 bundledSkillDir 在该 DSH 版本解析失败，技能会静默缺席——
          # 用 `shiban-store doctor` 或会话里的技能目录自检。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: true
              # 两路并行，互不依赖时序：
              #  ① 运行时插件 lib/paths.js 在模块加载时设 DSH_BUNDLED_SKILL_DIR
              #     （skill-filesystem 原生读它，此时它不会被构造早于此）；
              #  ② 若 ① 尚未发生，下面的 !!js 用 import.meta.url 等价机制兜底——
              #     通过 NODE_PATH 无关的 process.execPath 反查不可行，故显式读环境变量
              #     并在为空时回退到由 require.resolve 从 profile 解析。
              bundledSkillDir: !!js >-
                (function () {
                  const env = process.env.DSH_BUNDLED_SKILL_DIR;
                  if (env) return env;
                  const path = process.getBuiltinModule('node:path');
                  for (const base of [baseUrl, process.getBuiltinModule('node:path').join(process.cwd(), 'x.js')]) {
                    try {
                      const req = process.getBuiltinModule('node:module').createRequire(base);
                      return path.join(path.dirname(req.resolve('@levilou/dsh-shiban/package.json')), 'skills');
                    } catch (e) {}
                  }
                  return '';
                })()

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals ───────────────────────────────────────────────────────────
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ───────────────────────────────────────────────────────
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    你处于计划模式。在 exit_plan_mode 成功或用户切换会话模式之前，一直保持计划模式。
                    用不产生副作用的方式探索：read、grep、glob、静态检查。
                    不要编辑或写文件、不要改配置、不要提交、不要执行计划本身。
                    用 ask_user_question，只用于用户才有权决定的选择，或检查无法消除的实质歧义。
                    计划要决策完备：目标与成功标准、按子系统分组的改动、接口与数据流变化、
                    边界情况与失败模式、验收方式、明确的假设。
                    准备好后调用 exit_plan_mode 提交完整计划（以 # 标题开头），
                    并且让 exit_plan_mode 成为该回复中唯一且最后一个工具调用。

          # ── compaction ──────────────────────────────────────────────────────
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation ──────────────────────────────────────────────────────
          #
          # subagents 注册表在宿主平面；本预设只贡献委派工具。
          # workflows 是会话内服务，放在本挂载点私有的 realm 里。
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              # DSH 0.2.1-rc.3 起，tool-subagent 的 `persona` 与 `toolFilter`
              # 直接抛错（"is no longer supported"）；子 Agent 人格改为在
              # 独立 preset 里声明，用 agentPreset 绑定（见下方
              # preset-shiban-executor-v0-5-1）。fork 会继承父 preset，
              # 不能单独换人格，所以只挂在 spawn 行上。
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  # 实测：rc.5 的 schema 只认 modelSelectionSettings，
                  # modelSelection 会被静默忽略（不报错但能力关闭）。
                  # 等 0.2.2 真正移除旧名时会报错，届时再改。
                  modelSelectionSettings: true
                  agentPreset: ShiBan_Executor_V0_5_1

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork

              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  maxDepth: provider-managed

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── 其余模型可见工具 ────────────────────────────────────────────────
          # 提问是师伴的核心动作：教案/出题都以"问出来"而非"生成"为合格线。
          # timed 模式：等待 timeout 秒后模型可继续，问题卡片仍留在界面上可答——
          # 教师在上课或批作业时不会被挂住，回来照样能回。
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
            config:
              mode: timed
              timeout: 300

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

    # ── 师伴子 Agent 预设（模块执行者）─────────────────────────────────────
    #
    # DSH 0.2.1-rc.3 起，子 Agent 的人格与工具装配必须写成独立 preset，
    # 由父级委派行用 agentPreset 绑定；tool-subagent 的 persona 字段会直接抛错。
    # 本 preset 只做一件事：给 spawn 出来的模块执行者一套人格 + 最小工具面。
    #
    # 工具面刻意窄：执行者只加载技能、取上下文包、调 shiban-store、读写工作区文件。
    # 不挂 ask_user（子 Agent 存活时调用会被 DELEGATED_CALLER 拒绝，问题必须
    # 写进回执 needs_teacher[] 交给指挥）、不挂委派工具（禁止再委派）、
    # 不挂 ralph / workflow（原子任务不需要这些）。
    - id: preset-shiban-executor-v0-5-1
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: ShiBan_Executor_V0_5_1
        name: 师伴模块执行者 v0.5.1
        description: 师伴的子 Agent 人格——由指挥 Agent 委派的单个原子执行者。教师会话请选「师伴 v0.5.1」。
        order: 11
        plugins:
          # workdir 变量由运行时行（shiban-runtime-v0-5-1）在 Host 层注册，
          # assemble() 会先合并 global 层变量，预设内 persona 同样可见。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是师伴「模块执行者」子 Agent，由师伴指挥 Agent 委派，执行单个原子的专业任务。
                你不是指挥 Agent，也不是通用编码助手：不要做意图识别，不要再委派其他 Agent，不要组建团队。

                工作目录：{{workdir}}。

                ## 执行顺序（不可跳过）
                1. 用 skill 工具加载任务指定的技能（lesson-plan / quiz / class-eval /
                   class-profile / teacher-growth / html-material 之一）。
                   加载失败就停下并在回执里报 failed，不要凭记忆拼凑。
                2. 用 `shiban-store ctx pack --for <你的技能> ...` 取上下文包。
                   不要自己去翻文件拼输入——包里的字段名就是契约字段名。
                3. 按技能契约产出内容，然后用 `shiban-store artifact put` 提交。
                   id、版本、状态、引用校验都由 CLI 负责；你只提供 kind 与 payload。

                ## 你必须遵守的三条
                - 不编造：引用教材必须能在 `corpus read` 复现；缺语料就在 degrade 里声明。
                - 不越界：只写技能契约约定的产物品类；不改别人的产物；不直接编辑 $SHIBAN_ROOT 下的文件。
                - 不改状态：status 由 CLI 推进，你不能在 payload 里自封"已完成"。

                ## 返回给指挥的内容（只返回这一段，不粘贴产物正文）
                {
                  "task_id": "...",
                  "atom": "<你的技能名>",
                  "status": "ok|partial|failed",
                  "skills_loaded": ["<技能名>"],
                  "artifacts": [{"kind":"...", "id":"...", "rev":1}],
                  "degrade": ["..."],
                  "needs_teacher": ["..."],
                  "next_suggest": [{"atom":"...","why":"..."}],
                  "one_liner": "一句话结论（≤60 字）"
                }

                缺什么、降级到什么程度，都写在 degrade 里，不要用正文解释。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: true
              # 两路并行，互不依赖时序：
              #  ① 运行时插件 lib/paths.js 在模块加载时设 DSH_BUNDLED_SKILL_DIR
              #     （skill-filesystem 原生读它，此时它不会被构造早于此）；
              #  ② 若 ① 尚未发生，下面的 !!js 用 import.meta.url 等价机制兜底——
              #     通过 NODE_PATH 无关的 process.execPath 反查不可行，故显式读环境变量
              #     并在为空时回退到由 require.resolve 从 profile 解析。
              bundledSkillDir: !!js >-
                (function () {
                  const env = process.env.DSH_BUNDLED_SKILL_DIR;
                  if (env) return env;
                  const path = process.getBuiltinModule('node:path');
                  for (const base of [baseUrl, process.getBuiltinModule('node:path').join(process.cwd(), 'x.js')]) {
                    try {
                      const req = process.getBuiltinModule('node:module').createRequire(base);
                      return path.join(path.dirname(req.resolve('@levilou/dsh-shiban/package.json')), 'skills');
                    } catch (e) {}
                  }
                  return '';
                })()

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
